<!DOCTYPE html>
<html>

<body>
<pre>To run on local file, use a minimal server like "python -m http.server 8000 -d ."</pre>
<object id="obj1" type="image/svg+xml" data="CRC8_logic.svg"></object>
<script>
console.log('hello');
let t = 0;
document.getElementById("obj1").onload = function() {
	let doc2 = document.getElementById("obj1").contentDocument;
	let txt = doc2.getElementById("biti");	// inkscape text
	let box = doc2.getElementById("input");	// all elements in group are made clickable
	box.style['cursor'] = 'pointer';	// hand
	box.onclick = function() {
		txt.innerHTML = t; t ^= 1;
		txt.style['fill'] = '#0088FF';
		};
	};
</script>
</body></html>
